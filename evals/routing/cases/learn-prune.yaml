skill: learn-prune

should_trigger:
  - prompt: "The memory index has grown to forty lines. Curate it."
    why: "Keeping the always-loaded index small — the core job."
  - prompt: "Two lessons in memory contradict each other. Resolve it."
    why: "Contradiction resolution is explicitly in scope."
  - prompt: "Limpia las lecciones viejas que ya no aplican."
    why: "Pruning stale entries, in Spanish."
  - prompt: "This learned skill hasn't fired in months. Should it stay?"
    why: "Unused-entry curation."
  - prompt: "Our project memory is bloated and half of it is wrong now."
    why: "Both pruning and contradiction resolution at once."

should_not_trigger:
  - prompt: "Promote this candidate skill to active."
    route_to: "learn-graduate"
    why: "Promotion, not pruning."
  - prompt: "Save this new convention to memory."
    route_to: "praxis-memory"
    why: "Writing to the store, not curating it."
  - prompt: "Delete the unused code in this module."
    route_to: "engineer"
    why: "Source code, not the memory store."
  - prompt: "What does the memory currently say about our stack?"
    route_to: "praxis-memory"
    why: "Reading the store."

capability:
  - scenario: "The memory index has grown large and contains contradictions."
    must_include:
      - "Removes entries that are stale or unused rather than keeping everything just in case."
      - "Resolves contradictions by deciding which is current, not by keeping both."
      - "Keeps the index to one line per entry, because every line is loaded every session."
      - "Preserves the detail file when the index line is trimmed, rather than losing the record."
