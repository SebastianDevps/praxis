skill: decision-challenge

should_trigger:
  - prompt: "We're running the migration Friday. Poke holes in the plan before we commit."
    why: "An irreversible commitment about to happen — the bounded adversarial cycle."
  - prompt: "Play devil's advocate on this architecture bet before I sign off."
    why: "Explicit adversarial pressure on a decision already reached."
  - prompt: "Antes de comprometernos con este cambio de auth en producción, atácalo."
    why: "Production auth change about to be committed, in Spanish."
  - prompt: "The team is very confident about this and I'm not sure the evidence supports it."
    why: "Confidence outrunning evidence is the stated trigger."
  - prompt: "What would have to be true for this rollback plan to actually work?"
    why: "Falsification of a promised rollback — an attack on a load-bearing claim."

should_not_trigger:
  - prompt: "We have three options and haven't picked one. Which is best?"
    route_to: "strategy-compare"
    why: "Nothing is committed yet; the ask is the scored pick."
  - prompt: "Review this finished diff before merge."
    route_to: "refuter-correctness"
    why: "A finished change is the refuter panel's surface, not a decision packet."
  - prompt: "Gather evidence on how others solve this."
    route_to: "deep-research"
    why: "Open investigation, not a bounded attack on a stated claim."
  - prompt: "Should we add dark mode?"
    route_to: "brainstorming"
    why: "A reversible, low-consequence question — the challenge would cost more than being wrong."

capability:
  - scenario: "A team is about to run an irreversible production migration they call safe."
    must_include:
      - "Splits the non-atomic claim ('the migration is safe') into separate testable claims."
      - "Builds the challenge packet from artifact and evidence, excluding the author's confidence."
      - "Ends every doubt in a NAMED state — verified, refuted, mitigated, uncertain, accepted risk — never 'discussed'."
      - "Emits PROCEED / HOLD / STOP and names the unlock condition for a HOLD or STOP."
