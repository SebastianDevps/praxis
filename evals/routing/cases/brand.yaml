skill: brand

should_trigger:
  - prompt: "Extract a brand from this logo and these screenshots."
    why: "Deriving a system from existing assets — the core job."
  - prompt: "We have no brand. Define one and give me the tokens."
    why: "Defining an identity from scratch, output is design tokens."
  - prompt: "Dame los lineamientos de marca — tipografía, color, espaciado y voz."
    why: "Brand guidelines request, in Spanish."
  - prompt: "Turn our visual direction into reusable design tokens."
    why: "Tokenizing a direction into a durable system."
  - prompt: "What's our brand voice, and how should the product sound?"
    why: "Voice is part of the brand system this skill defines."

should_not_trigger:
  - prompt: "What mood and references should we aim for before any of this exists?"
    route_to: "creative-director"
    why: "Direction precedes the token system."
  - prompt: "Just fix the contrast on these two colors."
    route_to: "color-expert"
    why: "A palette fix, not the whole identity."
  - prompt: "Write the CTA copy for the pricing page."
    route_to: "copywriting"
    why: "Surface copy, not the voice definition."
  - prompt: "Build the homepage."
    route_to: "frontend-design"
    why: "Execution, not the system."

capability:
  - scenario: "A logo and two screenshots are provided and a brand system is requested."
    must_include:
      - "Extracts the ACTUAL typefaces and colors present rather than substituting defaults."
      - "Outputs tokens for type, color, spacing and voice, not prose adjectives."
      - "Checks the extracted palette against contrast requirements before shipping the tokens."
      - "States what it could not extract from the assets instead of inventing it."
