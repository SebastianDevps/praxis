skill: writing-plans

should_trigger:
  - prompt: "The approach is agreed. Write the plan before we start building."
    why: "Scope settled, work is substantial — the ledger comes before code."
  - prompt: "This touches the API, the schema and two components. Break it into tasks first."
    why: "Multi-file substantial work needs bite-sized, independently-testable tasks."
  - prompt: "Antes de escribir código, arma el checklist de tareas para esta migración."
    why: "Explicit request for a task breakdown ahead of implementation."
  - prompt: "I want to be able to hand these off one at a time. Make me the list."
    why: "Independently-testable tasks in a ledger is precisely the output."
  - prompt: "Give me a written plan for the auth refactor, not a four-bullet summary."
    why: "The skill exists to replace vague bullets with a real ledger."

should_not_trigger:
  - prompt: "The plan is written. Start executing it task by task with subagents."
    route_to: "subagent-driven-development"
    why: "Execution of an existing ledger, not authoring one."
  - prompt: "I don't know what I want yet — help me figure out the scope."
    route_to: "brainstorming"
    why: "Ambiguity must be resolved before a plan can be written."
  - prompt: "Move this change from design phase to implement phase."
    route_to: "spec-lifecycle"
    why: "Phase status advancement, not task authoring."
  - prompt: "Rename this variable across the file."
    route_to: "none"
    why: "Trivial single-file edit — a plan would be pure ceremony."

capability:
  - scenario: "An agreed multi-file feature needs a plan before any code."
    must_include:
      - "Produces tasks that are bite-sized and INDEPENDENTLY testable, not phases of one blob."
      - "Writes the plan to a ledger file rather than leaving it in the conversation."
      - "Gives each task an observable done-condition, so completion is checkable and not asserted."
      - "Notes which tasks are disjoint and could run in parallel, and which share files."
