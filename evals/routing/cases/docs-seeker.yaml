skill: docs-seeker

should_trigger:
  - prompt: "I'm using TanStack Query but I don't remember the v5 mutation API. Get me the real docs."
    why: "Unfamiliar or moved API on a named library — resolve the version and fetch topic-scoped docs."
  - prompt: "Necesito la referencia actual de la API de Resend para adjuntos, no lo que recuerdes."
    why: "Explicit refusal to trust training memory for one library's current API."
  - prompt: "What's the correct way to configure middleware in the Next.js version we have installed?"
    why: "Version-specific API question against the installed version — the exact job."
  - prompt: "Drizzle changed something in relations. Check the docs before you write the query."
    why: "A fast-moving library where stale memory is unsafe."
  - prompt: "Before you use that Playwright locator API, confirm it exists in our version."
    why: "Verifying an API against the resolved installed version rather than assuming."

should_not_trigger:
  - prompt: "Can I ship container queries, or do I need a fallback?"
    route_to: "baseline-status"
    why: "Web platform feature support status has its own instrument; this is not a library API."
  - prompt: "Compare the three main auth providers and cite who says what."
    route_to: "deep-research"
    why: "Multi-source comparative investigation, not one library's reference."
  - prompt: "Does this repo already wrap the Stripe client somewhere?"
    route_to: "scout"
    why: "Internal repo recon, not external docs."
  - prompt: "The docs are right but the call still throws. Find out why."
    route_to: "systematic-debugging"
    why: "An observed failure needs reproduction and root-cause tracing, not documentation."

capability:
  - scenario: "An agent is about to write code against a library it last saw in training."
    must_include:
      - "Resolves the EXACT installed version from the lockfile or manifest before fetching anything."
      - "Fetches docs scoped to the topic needed, not the whole reference."
      - "States the version the answer applies to, so a later reader can tell if it went stale."
      - "Says explicitly when the fetched docs contradict what was assumed, rather than blending them."
