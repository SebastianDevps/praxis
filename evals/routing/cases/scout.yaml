skill: scout

# Recon of THIS repo plus quick prior art, producing a findings note. It never decides.
should_trigger:
  - prompt: "Before I add a rate limiter, is there anything like it already in this codebase?"
    why: "Checking what already exists in the repo before building is the core job."
  - prompt: "Antes de proponer el enfoque, mira qué convenciones sigue este proyecto."
    why: "Reconnaissance of existing conventions ahead of a proposal — recon, not a decision."
  - prompt: "We need a job queue. What have people generally used for this, and do we have anything close?"
    why: "Prior art plus repo check, and the answer is a findings note rather than a pick."
  - prompt: "I'm about to pick a charting library. What's already installed here?"
    why: "Inventory of the current dependency surface before choosing — the recon half."
  - prompt: "New to this repo. Give me the lay of the land for the auth module before I touch it."
    why: "Orienting in existing code, read-only, output is a note."

should_not_trigger:
  - prompt: "We found three candidate libraries. Which one should we use?"
    route_to: "strategy-compare"
    why: "The options already exist and the ask is the pick — scout produces findings, never a decision."
  - prompt: "I need the current API surface for Drizzle 0.44 — what changed in the query builder?"
    route_to: "docs-seeker"
    why: "One named library's current docs at a resolved version, not a repo recon."
  - prompt: "Investigate how the industry handles multi-tenant isolation and cite your sources."
    route_to: "deep-research"
    why: "Multi-source external investigation with citations is deep-research, not a quick recon."
  - prompt: "Is `:has()` safe to ship for our browser support?"
    route_to: "baseline-status"
    why: "Web platform feature support has its own instrument."

capability:
  - scenario: "A developer asks whether the repo already has retry logic before they write one."
    must_include:
      - "Searches the repo first and names the concrete files and symbols found, with paths."
      - "Reports prior art as findings, and explicitly does NOT pick an approach or start implementing."
      - "States what it could not determine rather than filling the gap with an assumption."
      - "Ends by naming the next step — a decision skill or the specialist — rather than a dead end."
