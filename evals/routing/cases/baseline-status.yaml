skill: baseline-status

should_trigger:
  - prompt: "Can I use :has() in production or do I need a fallback?"
    why: "Direct web platform support question — the skill's core job."
  - prompt: "I want to use View Transitions for this page change. Safe?"
    why: "Modern web API whose Baseline status decides whether a fallback is required."
  - prompt: "¿Ya puedo usar container queries sin polyfill?"
    why: "Same support question in Spanish; the trigger is semantic."
  - prompt: "Write this layout with subgrid."
    why: "Emitting a modern CSS feature is itself the trigger — check Baseline before shipping it."
  - prompt: "Use color-mix() for the hover state."
    why: "A modern CSS function being emitted; support status and fallback must be checked."

should_not_trigger:
  - prompt: "What's the current API for the Vite plugin hook I need?"
    route_to: "docs-seeker"
    why: "A library's API reference, not a web platform feature's support status."
  - prompt: "This grid breaks on Safari. Find out why."
    route_to: "systematic-debugging"
    why: "An observed failure needs reproduction and root cause, not a support table."
  - prompt: "Pick the color palette for dark mode."
    route_to: "color-expert"
    why: "Palette design, not feature support."
  - prompt: "Set up cross-browser E2E coverage for these pages."
    route_to: "web-testing"
    why: "Test infrastructure, not a Baseline lookup."

capability:
  - scenario: "A page is being written that uses :has(), backdrop-filter and color-mix()."
    must_include:
      - "Names the Baseline status (Widely / Newly / Limited) for EACH feature used, not a blanket verdict."
      - "Supplies a concrete fallback for anything below Widely, rather than only flagging risk."
      - "Does not silently drop a feature to avoid the question — the decision is stated."
