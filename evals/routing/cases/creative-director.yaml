skill: creative-director

should_trigger:
  - prompt: "Before we build anything, what direction should this product take visually?"
    why: "Direction before building — the brief, not the code."
  - prompt: "Give me a mood and some references for this rebrand."
    why: "Concept, mood and references are the deliverable."
  - prompt: "Necesito una dirección creativa antes de que alguien toque el código."
    why: "Explicit direction-first request, in Spanish."
  - prompt: "What's the taste decision here — do we go warm and human or cold and technical?"
    why: "A taste decision at the direction level."
  - prompt: "Write a direction brief for the new marketing site."
    why: "Names the artifact this skill produces."

should_not_trigger:
  - prompt: "Now build the homepage from that direction."
    route_to: "frontend-design"
    why: "Execution follows the brief; this skill stops at the brief."
  - prompt: "Turn the direction into reusable tokens for type, color and spacing."
    route_to: "brand"
    why: "The durable token system is the brand skill."
  - prompt: "Choose the accent color and check its contrast."
    route_to: "color-expert"
    why: "Palette construction, downstream of direction."
  - prompt: "Critique the site we already shipped."
    route_to: "design-review"
    why: "Critique of an existing surface."

capability:
  - scenario: "A team asks for creative direction before a rebuild starts."
    must_include:
      - "Produces a BRIEF — concept, mood, references, taste decisions — and explicitly no code."
      - "Commits to a direction rather than presenting three safe options with no recommendation."
      - "Names what the direction rules OUT, not only what it allows."
      - "Hands off to the skill that builds or the skill that tokenizes, rather than ending flat."
