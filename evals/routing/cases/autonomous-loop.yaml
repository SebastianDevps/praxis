skill: autonomous-loop

should_trigger:
  - prompt: "Keep going until it's done — don't stop and ask me between steps."
    why: "Explicit request for a self-driven repeating run."
  - prompt: "Run this in a ralph loop overnight."
    why: "Names the pattern directly."
  - prompt: "Itera solo hasta que los tests pasen, sin preguntarme."
    why: "Unattended iterate-until-green, in Spanish."
  - prompt: "I want it to re-run itself on a fresh context each pass with progress kept in files."
    why: "Describes the mechanism the skill owns — fresh context per iteration, state in files and git."
  - prompt: "Set up an autonomous build that keeps working while I'm out."
    why: "Unattended run with guardrails outside the model."

should_not_trigger:
  - prompt: "Execute the plan task by task, with a review between each."
    route_to: "subagent-driven-development"
    why: "Reviewed, task-by-task execution is the opposite of an unattended loop."
  - prompt: "When is it responsible to let an agent run unattended at all?"
    route_to: "agentic-lifecycle"
    why: "The doctrine that decides when autonomy is appropriate, not the runner."
  - prompt: "The loop keeps failing on the same test. Why?"
    route_to: "systematic-debugging"
    why: "A repeating failure needs root-cause tracing, not another iteration."
  - prompt: "Write the checklist it should work through."
    route_to: "writing-plans"
    why: "Authoring the ledger the loop consumes."

capability:
  - scenario: "A user asks for an unattended run until the build is green."
    must_include:
      - "Does ONE thing per iteration rather than batching several changes into a pass."
      - "Keeps progress in files and git so a fresh context can resume without chat history."
      - "Defines the stop condition and the escalation trigger BEFORE starting the loop."
      - "Names the guardrails that live outside the model, since the model cannot bound itself."
