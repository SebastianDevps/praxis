skill: strategy-compare

should_trigger:
  - prompt: "Should we use Redis or an in-memory store for sessions?"
    why: "Two named plausible approaches and a pick is required — the core job."
  - prompt: "¿Server components o client-side fetching para esta vista? Dame la comparación."
    why: "Two viable approaches on the table, explicit request for a comparison."
  - prompt: "We could do this with a cron job, a queue, or a durable object. How should we do this?"
    why: "Three plausible paths; picking silently would hide a meaningful decision."
  - prompt: "Monorepo or separate repos for these two services?"
    why: "A structural fork with real tradeoffs in scope fit, risk and reversibility."
  - prompt: "There are two ways to model this schema and I keep going back and forth."
    why: "The options exist and the user is stuck on the pick, which is exactly what scoring resolves."

should_not_trigger:
  - prompt: "Make the app faster."
    route_to: "brainstorming"
    why: "No options exist yet and the goal is undefined — elicitation comes first."
  - prompt: "We chose the queue. Now attack that decision before we build it."
    route_to: "decision-challenge"
    why: "The choice is made; the ask is adversarial pressure on a commitment, not a comparison."
  - prompt: "Which of these libraries is already installed here?"
    route_to: "scout"
    why: "A factual repo lookup, not a scored decision."
  - prompt: "Break the chosen approach into tasks."
    route_to: "writing-plans"
    why: "Downstream of the decision."

capability:
  - scenario: "A team must choose between Redis and in-memory session storage."
    must_include:
      - "Scores both on scope fit, risk, effort and reversibility rather than listing generic pros and cons."
      - "Surfaces a tie explicitly instead of manufacturing a winner."
      - "Recommends ONE option and names what would change the recommendation."
      - "Does not begin implementing the winner in the same pass."
