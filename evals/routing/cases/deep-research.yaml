skill: deep-research

should_trigger:
  - prompt: "Compare Postgres logical replication against Debezium for our CDC pipeline, with sources."
    why: "Comparing options using evidence from multiple independent sources, with citations."
  - prompt: "Investiga cómo están resolviendo el rate limiting distribuido las empresas grandes en 2026."
    why: "External multi-source investigation of current practice — the core job."
  - prompt: "Is there prior art for doing incremental static regeneration without a Node server?"
    why: "Prior-art hunt that needs cross-checked external sources, not a repo grep."
  - prompt: "I need a defensible answer on whether WebGPU is production-ready. Show me who says what."
    why: "The ask is evidence and disagreement across sources, which is what synthesis with citations gives."
  - prompt: "Research the tradeoffs between event sourcing and a plain audit log for our compliance need."
    why: "A question whose answer requires gathering and cross-checking rather than recalling."

should_not_trigger:
  - prompt: "What does this repo already do for background jobs?"
    route_to: "scout"
    why: "Recon inside the current codebase is scout — no external sourcing needed."
  - prompt: "Pull the current Stripe webhook signature verification docs for the version we have installed."
    route_to: "docs-seeker"
    why: "One library, resolved version, topic-scoped docs — not a multi-source investigation."
  - prompt: "We already have the three options and the evidence. Just pick one."
    route_to: "strategy-compare"
    why: "The gathering is done; the ask is the scored decision."
  - prompt: "The migration plan says it is safe. Poke holes in it before we run it."
    route_to: "decision-challenge"
    why: "Attacking a decision already made is a bounded adversarial cycle, not open research."

capability:
  - scenario: "The team must choose between two queueing approaches and wants a sourced answer."
    must_include:
      - "Scopes the question before gathering, so the search has a stated stopping condition."
      - "Gathers from multiple INDEPENDENT sources and cross-checks claims against each other."
      - "Surfaces where sources disagree instead of averaging them into a single confident claim."
      - "Cites each load-bearing claim with a source and its date; marks anything it could not verify."
