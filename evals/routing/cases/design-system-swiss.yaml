skill: design-system-swiss

should_trigger:
  - prompt: "Swiss / International style for this marketing site."
    why: "Names the system directly."
  - prompt: "Strict grid, type does the work, almost no color."
    why: "Grid discipline and type-driven hierarchy are the signature."
  - prompt: "Quiero algo tipográfico y muy ordenado, estilo editorial suizo."
    why: "Typographic, grid-ordered, Swiss, in Spanish."
  - prompt: "Content-first layout where the typography carries the hierarchy, not color."
    why: "Type-driven hierarchy with minimal color is the definition."
  - prompt: "Build the docs home on a rigorous baseline grid."
    why: "Strict grid discipline applied to a content surface."

should_not_trigger:
  - prompt: "Lay out this long blog post so it's comfortable to read."
    route_to: "editorial-layout"
    why: "The reading page itself, not the grid system in the abstract."
  - prompt: "Soft consumer SaaS with rounded corners and one accent."
    route_to: "design-system-clean"
    why: "A different visual system."
  - prompt: "Bento grid of feature tiles."
    route_to: "design-system-bento"
    why: "Modular tiles rather than a typographic grid."
  - prompt: "Which typeface pairs well with our logo?"
    route_to: "brand"
    why: "Identity-level type selection belongs to the brand system."

capability:
  - scenario: "A content-first marketing site must be built in the Swiss style."
    must_include:
      - "Establishes an explicit grid and holds elements to it rather than eyeballing alignment."
      - "Drives hierarchy through type size, weight and spacing rather than color."
      - "Keeps color minimal and functional, not decorative."
      - "Does not default to Inter, Roboto or Open Sans."
