skill: deck-builder

should_trigger:
  - prompt: "Build me a deck for the investor meeting."
    why: "Slides with a narrative arc — the core job."
  - prompt: "Turn this doc into a presentation."
    why: "Converting prose into slides."
  - prompt: "Arma la presentación del roadmap para el comité."
    why: "Deck construction, in Spanish."
  - prompt: "My slides are wall-to-wall bullets. Fix the structure."
    why: "Bullet soup is the exact problem this skill exists to solve."
  - prompt: "I need a pitch that builds to the ask instead of listing features."
    why: "Narrative arc across slides."

should_not_trigger:
  - prompt: "Lay out this long-form article for reading."
    route_to: "editorial-layout"
    why: "A reading page, not slides."
  - prompt: "Write the headline and the body copy."
    route_to: "copywriting"
    why: "The words, not the slide structure."
  - prompt: "Design the ad creative for this campaign."
    route_to: "ad-creative"
    why: "A paid asset, not a deck."
  - prompt: "Chart the revenue numbers for slide four."
    route_to: "data-visualization"
    why: "The chart itself is a separate discipline."

capability:
  - scenario: "A dense strategy document must become an investor deck."
    must_include:
      - "Puts ONE idea on each slide rather than transplanting paragraphs."
      - "Builds a narrative arc with a stated ask, not a flat list of sections."
      - "Uses visual hierarchy so each slide has an obvious focal point."
      - "Cuts content rather than shrinking type to fit."
