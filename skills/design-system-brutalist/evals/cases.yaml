skill: design-system-brutalist

should_trigger:
  - prompt: "Make the landing page brutalist."
    why: "Names the system directly."
  - prompt: "I want it raw and loud — visible borders, no rounded corners, high contrast."
    why: "The brutalist signature: visible structure, sharp edges, contrast."
  - prompt: "Anti-design aesthetic, system fonts, nothing polished."
    why: "System fonts and deliberate roughness are the system's markers."
  - prompt: "Quiero algo crudo y expresivo, que se note la estructura."
    why: "Raw and expressive with visible structure, in Spanish."
  - prompt: "This looks like every other SaaS. Make it bold and confrontational instead."
    why: "The move away from restrained polish toward expressive boldness."

should_not_trigger:
  - prompt: "Soft shadows, rounded corners, minimal SaaS feel."
    route_to: "design-system-clean"
    why: "Soft and restrained is the opposite system."
  - prompt: "Strict grid with type-driven hierarchy and almost no color."
    route_to: "design-system-swiss"
    why: "Disciplined typographic grid, not raw expressive structure."
  - prompt: "Make this feel native on iOS."
    route_to: "apple-hig"
    why: "Platform conventions, not a visual system choice."
  - prompt: "Write the headline copy for it."
    route_to: "copywriting"
    why: "Words, not the visual system."

capability:
  - scenario: "A marketing page should be rebuilt in a brutalist style."
    must_include:
      - "Makes structure VISIBLE — borders, hard edges, explicit grid lines — rather than hiding it."
      - "Uses high contrast deliberately and still meets the a11y-baseline contrast floor."
      - "Avoids the AI defaults even while being loud — no Inter, no purple gradient."
      - "Keeps interactive controls identifiable as controls despite the rough aesthetic."
