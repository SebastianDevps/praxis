skill: spec-lifecycle

should_trigger:
  - prompt: "Move the checkout change from design into implement."
    why: "Controlled phase advancement of a tracked change — the core job."
  - prompt: "What phase is the notifications change in, and what has to be true to advance it?"
    why: "Status query plus the advancement gate for a spec-driven change."
  - prompt: "Run this change through the spec workflow — research, design, plan, implement."
    why: "Explicit request for the lean lifecycle."
  - prompt: "Registra el estado de este cambio y avánzalo si el gate está verde."
    why: "Status advancement with a gate check, in Spanish."
  - prompt: "I want this tracked as a change with phases rather than done ad hoc."
    why: "Adopting the lifecycle for a piece of work."

should_not_trigger:
  - prompt: "Explain when it's safe to let agents run near-autonomously and where the human gate goes."
    route_to: "agentic-lifecycle"
    why: "That is the doctrine above the phases, not the phase mechanics."
  - prompt: "Break the implement phase into tasks."
    route_to: "writing-plans"
    why: "Task authoring within a phase, not phase advancement."
  - prompt: "Keep iterating on this until the tests pass, unattended."
    route_to: "autonomous-loop"
    why: "A self-driven loop runner, not a phase model."
  - prompt: "What already exists in the repo for this?"
    route_to: "scout"
    why: "Recon, not lifecycle management."

capability:
  - scenario: "A change is in design phase and someone asks to start implementing."
    must_include:
      - "Checks the exit gate of the CURRENT phase before advancing, rather than advancing on request."
      - "Names what is missing when the gate is red instead of advancing with a caveat."
      - "Records the phase transition somewhere durable, not only in the reply."
